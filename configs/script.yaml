# Default query entry: scheme 4, summary-first cross-stage entity memory.
# All model paths are relative to the project working directory.
schema_version: 2
seed: 0
method: B2
construction:
  strategy: goal_lazy
  prebuild_entity_candidates: false
  prebuild_relations: false
  prebuild_identity_links: false
cache:
  scope: query
query:
  pipeline: scheme4
  temporal_entity_source: summary
  temporal_sparse_visual: true
  answer_order: original
  caption_policy: full
initialization:
  caption_source: provided
budget:
  online_cap: 1500
  tool_call_cap: 150
  final_answer_reserve: 45
models:
  visual_encoder: checkpoints/BAAI/EVA-CLIP-8B
  detector: checkpoints/IDEA-Research/grounding-dino-tiny
  vlm: checkpoints/Qwen/Qwen2.5-VL-7B-Instruct
  text_embedding: checkpoints/BAAI/bge-m3
  device: cuda
  local_files_only: true
