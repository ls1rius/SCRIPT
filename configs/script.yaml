# Appendix B defaults are defined and validated in script_core/config.py.
# All model paths are relative to the project working directory.
schema_version: 2
seed: 0
method: B2
construction:
  strategy: goal_lazy
  prebuild_entity_candidates: false
  prebuild_relations: false
  prebuild_identity_links: false
cache:
  scope: query
query:
  reading_policy: coverage_first
  caption_first: false
  answer_strategy: direct
  answer_order: content_hash
  caption_policy: full
models:
  visual_encoder: checkpoints/BAAI/EVA-CLIP-8B
  detector: checkpoints/IDEA-Research/grounding-dino-tiny
  vlm: checkpoints/Qwen/Qwen2.5-VL-7B-Instruct
  text_embedding: checkpoints/BAAI/bge-m3
  device: cuda
  local_files_only: true
